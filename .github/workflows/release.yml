# Builds the Windows desktop app and publishes a GitHub release whenever a
# v* tag is pushed. The release contains the NSIS installer (.exe) — download
# it and run it on the kitchen PC to install or update (it installs over the
# previous version). No secrets are required.
name: Release desktop app

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Central Kitchen Kuhinja ${{ github.ref_name }}'
          releaseBody: >
            Instalacija ili ažuriranje: preuzeti .exe ispod i pokrenuti ga
            (instalira se preko postojeće verzije).
          releaseDraft: false
          prerelease: false
