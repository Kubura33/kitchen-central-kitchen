# Builds the Windows desktop app and publishes a GitHub release whenever a
# v* tag is pushed. The release includes the NSIS installer, the signed
# updater artifact and latest.json — the feed the installed apps poll.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          contents of ~/.tauri/kitchen-central-kitchen.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD empty string (key was generated without one)
name: Release desktop app

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Central Kitchen Kuhinja ${{ github.ref_name }}'
          releaseBody: >
            Instalacija: preuzeti .exe ispod i pokrenuti ga. Instalirana
            aplikacija se ubuduće ažurira sama pri pokretanju.
          releaseDraft: false
          prerelease: false
